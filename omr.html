<!--
  ★ 답안 사진 올리기 (2026-11-08 · 주인은 「문제은행」 방 — 고칠 일이 있으면 그 방에)
    사장님 「애들이 특정 공간에 넣으면 너가 바로 감지해서 채점」 · 「qr 로」
    학생: OMR 용지(판 2) 오른쪽의 QR → 이 페이지 → OMR 찍기 → 저장소 omr-up 보관함에 «넣기만»(로그인 없음).
    사장님 컴퓨터(문제은행 도구/성장/올림받기.js)가 몇 분마다 꺼내 가 채점하고 학생관리에 넣는다.
    올리기 전에 이 페이지가 «네 귀퉁이 검은 네모» 가 보이는지 재서, 안 보이면 다시 찍게 한다(흐린 사진·잘린 사진을 여기서 거른다).
    보관함 규칙: 지침서 「3단계 표-답안올림.sql」 (넣기 = 누구나 · 보기·지우기 = 사장님만 · 이름 꼴 omr-<13자리 시각>-<글자>.jpg)
  ★ 2026-11-10 사장님 「진행시켜」(못 읽으면 조용히 멈춘다 — 학생도 선생님도 모름):
    올린 뒤 이 페이지가 결과 칸(omr-res/<사진 이름>.json · 지침서 「3단계 표-답안결과.sql」)을 몇 초마다 본다.
    사장님 컴퓨터가 «받음» → «읽음(누구 답안)» 또는 «다시(무엇을 고쳐 다시 찍을지)» 를 놓는다. 점수는 안 띄운다(선생님·카톡 몫).
    휜 종이(중철)를 비스듬히 찍으면 못 읽는다 — 그래서 «평평하게 펴고 바로 위에서» 를 앞에 둔다.
-->

<main>
  <!-- ★ 11-13 사장님: 위에 쓸데없는 말 다 빼고 · 찍기 단추는 맨 위 그대로 · 그 아래 «보내기» 단추 —
       누르면 보내지고, 보내지면 보내기 단추가 «받았어요 ✔» 로 바뀐다(찍자마자 저절로 올리던 것을 걷음) · 사진첩에서 고르기 없음 -->

     카메라를 못 열면(권한 거절 · 카톡 안 브라우저 등) 폰 기본 카메라로 바뀐다. 아래 흰 단추는 혹시 안 잡힐 때 손으로 찍는 것. -->

<script>
"use strict";
const 주소 = "https://burwsvkcaiqfiymdptex.supabase.co";
const 공개열쇠 = "sb_publishable_Yxaq9Rbth3NUmcREMwlbSg_qaXpoLVy";     // 홈페이지와 같은 공개 열쇠(넣기만 된다)
const 보관함 = "omr-up";
const 결과곳 = "omr-res";                                              // 사장님 컴퓨터가 놓는 «받음·읽음·다시» (공개 · 이름을 아는 사람만)
const 긴변 = 2400;                                                    // 올리는 사진 긴 변(px) — 칸과 글씨가 읽힐 만큼

const $ = id => document.getElementById(id);
let 대기 = null;                                                       // 찍은 사진 — «보내기» 를 누르면 올린다
// 보내기 단추: 없음(사진 전 · 잠김) → 준비(누를 수 있음) → 보내는중 → 받음(«받았어요 ✔») · 실패면 «다시 보내기»
function 보내기단추(상태) {
  const b = $("보내기");
  const [글, 잠금] = { 없음: ["보내기", true], 준비: ["보내기", false], 보내는중: ["보내는 중…", true], 받음: ["받았어요 ✔", true], 실패: ["다시 보내기", false] }[상태];
  b.textContent = 글; b.disabled = 잠금; b.classList.toggle("받음", 상태 === "받음");
}
function 알림지우기() { $("알림").className = ""; $("알림").innerHTML = ""; }

function 알리기(종류, 글) { const a = $("알림"); a.className = 종류; a.innerHTML = 글; try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {} }
function 이름() {
  const 글자 = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const r = new Uint32Array(12); crypto.getRandomValues(r);
  return "omr-" + Date.now() + "-" + Array.from(r, x => 글자[x % 글자.length]).join("") + ".jpg";
}

async function 그림읽기(파일) {
  // createImageBitmap 은 폰 사진의 돌림(EXIF)을 바로잡아 준다
  try { return await createImageBitmap(파일, { imageOrientation: "from-image" }); }
  catch (e) {
    return await new Promise((ok, 안됨) => { const i = new Image(); i.onload = () => ok(i); i.onerror = 안됨; i.src = URL.createObjectURL(파일); });
  }
}
function 줄이기(그림, 최대) {
  const w = 그림.videoWidth || 그림.width, h = 그림.videoHeight || 그림.height, k = Math.min(1, 최대 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(그림, 0, 0, c.width, c.height);
  return c;
}

// 귀퉁이 검은 네모 재기 — 작게 줄여 어두운 덩어리 중 «꽉 찬 네모» 를 찾고, 그 넷이 사진의 큰 네모를 이루는지 본다
function 귀퉁이재기(캔, 옵 = {}) {
  // 옵(카메라 화면에서 살필 때 — 11-14 사장님 「존나 정확히 잡아야만 찍힌다」): 영상은 흐릿해 가는 테두리가 회색으로 끊긴다 →
  //   «잉크» 문턱을 너그럽게(비 · 문) · 한 칸 부풀려 끊긴 데를 잇고(굵게) · 고리가 굵어진 만큼 «참» 문턱도 너그럽게(고리참)
  const 비 = 옵.비 || 0.62, 문 = 옵.문 || 140, 고리참 = 옵.고리참 || 0.2;
  const 작 = 줄이기(캔, 옵.크기 || 800), W = 작.width, H = 작.height;
  const d = 작.getContext("2d").getImageData(0, 0, W, H).data;
  const g = new Float32Array(W * H);
  let 합 = 0;
  for (let i = 0; i < W * H; i++) { g[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]; 합 += g[i]; }
  const 밝기 = 합 / (W * H);
  // 둘레 평균(적분 그림)보다 한참 어두우면 «잉크»
  const I = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let 줄 = 0; for (let x = 0; x < W; x++) { 줄 += g[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + 줄; } }
  const r = Math.max(8, Math.round(Math.min(W, H) * 0.05));
  const 검 = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1), y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
    const 평 = (I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0]) / ((x1 - x0) * (y1 - y0));
    검[y * W + x] = g[y * W + x] < 평 * 비 && g[y * W + x] < 문 ? 1 : 0;
  }
  if (옵.굵게) {                                                       // 한 칸 부풀리기(3×3) — 끊긴 테두리를 잇는다
    const 원 = 검.slice();
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      if (!원[i] && (원[i - 1] | 원[i + 1] | 원[i - W] | 원[i + W] | 원[i - W - 1] | 원[i - W + 1] | 원[i + W - 1] | 원[i + W + 1])) 검[i] = 1;
    }
  }
  // 덩어리(4 이웃)
  const 표 = new Int32Array(W * H).fill(-1), 덩 = [];
  const 쌓 = new Int32Array(W * H);
  for (let s = 0; s < W * H; s++) {
    if (!검[s] || 표[s] >= 0) continue;
    let n = 0, top = 0, minx = W, maxx = 0, miny = H, maxy = 0, sx = 0, sy = 0;
    let s0 = null, s1 = null, d0 = null, d1 = null;                    // 대각선 끝점(x+y 가장 작은·큰 · x−y 가장 작은·큰) — 고리의 네 꼭지
    쌓[top++] = s; 표[s] = 덩.length;
    while (top) {
      const p = 쌓[--top], px = p % W, py = (p - px) / W; n++; sx += px; sy += py;
      if (px < minx) minx = px; if (px > maxx) maxx = px; if (py < miny) miny = py; if (py > maxy) maxy = py;
      if (!s0 || px + py < s0[0] + s0[1]) s0 = [px, py]; if (!s1 || px + py > s1[0] + s1[1]) s1 = [px, py];
      if (!d0 || px - py < d0[0] - d0[1]) d0 = [px, py]; if (!d1 || px - py > d1[0] - d1[1]) d1 = [px, py];
      for (const q of [p - 1, p + 1, p - W, p + W]) {
        if (q < 0 || q >= W * H || 표[q] >= 0 || !검[q]) continue;
        if ((q === p - 1 && px === 0) || (q === p + 1 && px === W - 1)) continue;
        표[q] = 덩.length; 쌓[top++] = q;
      }
    }
    const bw = maxx - minx + 1, bh = maxy - miny + 1;
    덩.push({ n, bw, bh, cx: sx / n, cy: sy / n, 참: n / (bw * bh), s0, s1, d0, d1 });
  }
  const 짧 = Math.min(W, H);
  const 네모 = 덩.filter(b => b.bw >= 짧 * 0.008 && b.bw <= 짧 * 0.09 && b.bh >= 짧 * 0.008 && b.bh <= 짧 * 0.09 &&
                          b.bw / b.bh > 0.6 && b.bw / b.bh < 1.65 && b.참 > 0.72);
  // 크기가 비슷한 넷 중 가장 넓게 펼쳐진 것
  let 최 = null;
  if (네모.length >= 4) {
    const 큰 = 네모.sort((a, b) => b.n - a.n).slice(0, 12);
    for (let a = 0; a < 큰.length; a++) for (let b = a + 1; b < 큰.length; b++) for (let c = b + 1; c < 큰.length; c++) for (let e = c + 1; e < 큰.length; e++) {
      const 넷 = [큰[a], 큰[b], 큰[c], 큰[e]], ns = 넷.map(t => t.n);
      if (Math.max(...ns) > 3 * Math.min(...ns)) continue;
      const xs = 넷.map(t => t.cx), ys = 넷.map(t => t.cy);
      const 넓이 = (Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys));
      if (!최 || 넓이 > 최.넓이) 최 = { 넓이, 넷 };
    }
  }
  const 덮음 = 최 ? 최.넓이 / (W * H) : 0;
  // 흐림 — 라플라시안 세기
  let 라 = 0, 라n = 0;
  for (let y = 1; y < H - 1; y += 2) for (let x = 1; x < W - 1; x += 2) {
    const v = 4 * g[y * W + x] - g[y * W + x - 1] - g[y * W + x + 1] - g[(y - 1) * W + x] - g[(y + 1) * W + x]; 라 += v * v; 라n++;
  }
  // ★ 11-13 판 3(점 넷 대신 테두리 한 줄): 사진의 넓은 범위를 감싸는 가는 고리(꽉 차지 않은 큰 덩어리)가 있으면 테두리가 보인 것
  const 고리 = 덩.filter(b => b.bw * b.bh > 0.12 * W * H && b.참 < 고리참 && b.bw > 짧 * 0.3 && b.bh > 짧 * 0.3).sort((a, b) => b.bw * b.bh - a.bw * a.bh)[0];
  const 테두리 = !!고리;
  // 종이 네 꼭지(왼위 · 오른위 · 오른아래 · 왼아래) — 테두리가 있으면 그 고리, 없으면 네 귀퉁이 네모(판 2)
  let 넷 = null;
  if (고리) 넷 = [고리.s0, 고리.d1, 고리.s1, 고리.d0];
  else if (최) {
    const c = 최.넷.map(t => [t.cx, t.cy]);
    const 골 = f => c.reduce((a, b) => (f(b) > f(a) ? b : a));
    넷 = [골(p => -p[0] - p[1]), 골(p => p[0] - p[1]), 골(p => p[0] + p[1]), 골(p => p[1] - p[0])];
  }
  // 네모 안 잉크 — 빈 종이(어두운 책상 위 흰 종이 끝도 고리처럼 잡힌다)는 안이 텅 비었다. 가장자리 띠를 빼고(안쪽 80%) 잉크 칸 비율.
  let 잉크 = 0;
  if (넷) {
    const xs = 넷.map(p => p[0]), ys = 넷.map(p => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const hw = (Math.max(...xs) - Math.min(...xs)) * 0.4, hh = (Math.max(...ys) - Math.min(...ys)) * 0.4;
    let n = 0, m = 0;
    for (let y = Math.max(0, Math.round(cy - hh)); y < Math.min(H, Math.round(cy + hh)); y++)
      for (let x = Math.max(0, Math.round(cx - hw)); x < Math.min(W, Math.round(cx + hw)); x++) { n++; m += 검[y * W + x]; }
    잉크 = n ? m / n : 0;
  }
  return { 귀퉁이: 네모.length, 덮음, 테두리, 넷, 잉크, W, H, 선명: 라 / Math.max(1, 라n), 밝기 };
}

async function 올리기(캔) {
  보내기단추("보내는중");
  const 덩이 = await new Promise(ok => 캔.toBlob(ok, "image/jpeg", 0.88));
  const 파일이름 = 이름();
  let 답;
  try {
    답 = await fetch(주소 + "/storage/v1/object/" + 보관함 + "/" + 파일이름, {
      method: "POST",
      headers: { apikey: 공개열쇠, Authorization: "Bearer " + 공개열쇠, "Content-Type": "image/jpeg", "x-upsert": "false" },
      body: 덩이 });
  } catch (e) { 답 = null; }

    알리기("나쁨", "<b>못 보냈어요.</b> 다시 보내기를 눌러 주세요.<br><span class='작은'>(" + String(왜).slice(0, 120).replace(/</g, "&lt;") + ")</span>");
    보내기단추("실패");

  }

  알림지우기();
  보내기단추("받음");
  $("찍기").textContent = "📷 한 장 더 찍기";
  const t = { 파일이름, 때: Date.now(), 상태: "기다림" };
  올린것.unshift(t);

}

// ── 올린 사진마다 결과 칸(omr-res/<사진 이름>.json)을 몇 초마다 본다 — 사장님 컴퓨터가 «받음 → 읽음/다시» 를 놓는다
const 올린것 = [];
const 글막 = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function 줄그리기(t) {
  $("올린").classList.remove("숨김");
  if (!t.칸) { t.칸 = document.createElement("div"); $("올린줄").prepend(t.칸); }
  const 시 = new Date(t.때).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  const 이름 = (t.이름 || []).map(글막).join(", ");
  const 판 = {
    기다림: ["기다림", "<span class='돌기'></span>올라갔어요. 선생님 컴퓨터가 가져가길 기다리는 중… (보통 1분 안)"],
    받음: ["기다림", "<span class='돌기'></span>선생님 컴퓨터가 받았어요. 읽는 중…"],
    읽음: ["좋음", "<b>✔ " + (이름 || "답안") + "</b> 답안으로 받았어요. 채점 결과는 선생님이 알려 줘요.<br><span class='때'>이름이 내 것이 아니면 고유번호를 잘못 칠한 거예요 — 선생님께 말해 주세요.</span>"],
    다시: ["나쁨", "<b>✘ 다시 찍어 주세요.</b><br>" + 글막(t.말 || "사진을 잘 못 읽었어요.") + (이름 ? "<br><span class='때'>읽은 것: " + 이름 + "</span>" : "")],
    늦음: ["주의", "선생님 컴퓨터가 아직 안 가져갔어요(꺼져 있을 수 있어요). 사진은 잘 올라갔으니 창을 닫아도 돼요 — 켜지면 채점돼요."],
    늦음2: ["주의", "읽는 데 오래 걸려요. 창을 닫아도 돼요 — 선생님이 확인할 거예요."],
  }[t.상태] || ["기다림", 글막(t.상태)];
  t.칸.className = "줄 " + 판[0];
  t.칸.innerHTML = "<span class='때'>" + 시 + " 올린 사진</span><br>" + 판[1];
}
async function 결과보기(t) {
  const 이름 = t.파일이름.replace(/\.[a-z]+$/i, ".json");
  for (;;) {
    if (Date.now() - t.때 > 6 * 60e3) { t.상태 = t.상태 === "받음" ? "늦음2" : "늦음"; 줄그리기(t); return; }
    try {
      const r = await fetch(주소 + "/storage/v1/object/public/" + 결과곳 + "/" + 이름 + "?t=" + Date.now(), { cache: "no-store" });
      // 결과 칸(omr-res)이 아직 서버에 없으면 기다리지 않는다 — 위의 «받았어요 ✔» 만 둔다
      if (!r.ok && /Bucket not found/i.test(await r.clone().text().catch(() => ""))) return;
      if (r.ok) {
        const j = await r.json();
        if (j && j.상태 && j.상태 !== t.상태) {
          t.상태 = j.상태; t.이름 = Array.isArray(j.이름) ? j.이름 : []; t.말 = j.말; 줄그리기(t);
          if (j.상태 === "다시" && t === 올린것[0]) {
            알리기("나쁨", "<b>✘ 다시 찍어 주세요.</b><br>" + 글막(j.말 || ""));
            $("찍기").textContent = "📷 다시 찍기";
            try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
          }
          if (j.상태 === "읽음" && t === 올린것[0] && t.이름.length) 알리기("좋음", t.이름.map(글막).join(", "));
        }
        if (j && (j.상태 === "읽음" || j.상태 === "다시")) return;
      }
    } catch (e) {}
    await new Promise(z => setTimeout(z, 4000));
  }
}

async function 받음(파일) {
  if (!파일) return;
  let 그림;
  try { 그림 = await 그림읽기(파일); } catch (e) { 알리기("나쁨", "이 사진은 열 수가 없어요. 다시 찍어 주세요."); return; }
  await 받은그림(그림);
}
async function 받은그림(그림) {
  알림지우기();
  보내기단추("없음");
  대기 = null;
  const 캔 = 줄이기(그림, 긴변);
  $("미리").src = 캔.toDataURL("image/jpeg", 0.6); $("미리").style.display = "block";
  const 잼 = 귀퉁이재기(캔, { 비: 0.8, 문: 175, 굵게: true, 고리참: 0.3 });   // 카메라 화면과 같이 너그럽게(11-14) — 읽기가 버틴다
  const 문제 = [];
  if (잼.밝기 < 60) 문제.push("사진이 너무 어두워요. 밝은 곳에서 찍어 주세요.");
  if (!잼.넷) 문제.push("OMR이 다 안 보여요. 종이 전체가 나오게 찍어 주세요.");
  if (잼.선명 < 10) 문제.push("사진이 많이 흐려요. 다시 찍어 주세요.");
  if (문제.length) {                                                    // 걸리는 게 있으면 알려만 준다 — 보낼지는 학생이(보내기 단추)
    알리기("주의", 문제.join("<br>"));
    $("찍기").textContent = "📷 다시 찍기";
  }
  대기 = 캔;
  보내기단추("준비");
}

// ── 화면 안 카메라(11-14 사장님 「자동으로 안 찍히는데?」) — 민증 찍듯이: 종이 테두리가 잡히고 흔들림이 멎으면 저절로 찰칵
let 스트림 = null, 살핌 = false, 이전 = null, 멎음 = 0, 파일로 = false;
async function 카메라열기() {
  try {
    스트림 = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
  } catch (e) { return false; }
  const v = $("영상");
  v.srcObject = 스트림;
  try { await v.play(); } catch (e) {}
  $("캠").classList.remove("숨김");
  $("캠말").textContent = "OMR을 화면에 비춰 주세요"; $("캠말").className = "";
  살핌 = true; 이전 = null; 멎음 = 0;
  setTimeout(살피기, 300);
  return true;
}
function 카메라닫기() {
  살핌 = false;
  if (스트림) 스트림.getTracks().forEach(t => t.stop());
  스트림 = null; $("영상").srcObject = null;
  $("캠").classList.add("숨김");
}
function 겹그리기(잼) {                                                // 잡힌 종이 둘레를 초록 선으로(영상은 화면에 «contain» 으로 맞춰 보인다)
  const c = $("겹"), v = $("영상"), dpr = window.devicePixelRatio || 1;
  const cw = c.clientWidth * dpr, ch = c.clientHeight * dpr;
  if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
  const x = c.getContext("2d"); x.clearRect(0, 0, cw, ch);
  if (!잼 || !잼.넷 || !v.videoWidth) return;
  const k = Math.min(cw / v.videoWidth, ch / v.videoHeight), ox = (cw - v.videoWidth * k) / 2, oy = (ch - v.videoHeight * k) / 2;
  const 비 = v.videoWidth / 잼.W;
  x.strokeStyle = "#22c55e"; x.lineWidth = 5 * dpr; x.lineJoin = "round"; x.beginPath();
  잼.넷.forEach(([px, py], i) => { const X = ox + px * 비 * k, Y = oy + py * 비 * k; i ? x.lineTo(X, Y) : x.moveTo(X, Y); });
  x.closePath(); x.stroke();
}
function 살피기() {
  if (!살핌) return;
  const v = $("영상");
  if (v.videoWidth) {
    // ★ 11-14 사장님 「자동으로 찍히긴 한데 존나 정확히 잡아야만 찍힌다」 — 너그럽게: 종이가 대충 다 보이면(화면의 12% 넘게 · 끝에 안 걸림)
    //   두 번 연달아 잡히고 크게 안 움직이면 찍는다. 선명함은 여기서 안 따진다(찍은 뒤 사진으로 본다 · 읽기가 버틴다).
    const 잼 = 귀퉁이재기(줄이기(v, 640), { 크기: 640, 비: 0.8, 문: 175, 굵게: true, 고리참: 0.3 });
    let 말 = "OMR을 화면에 비춰 주세요", 좋음 = false;
    if (잼.넷 && 잼.잉크 < 0.01) { 이전 = null; 멎음 = 0; }              // 빈 종이 — OMR 이 아니다
    else if (잼.넷) {
      const 짧 = Math.min(잼.W, 잼.H);
      const 넓 = Math.abs(잼.넷.reduce((s, p, i) => { const q = 잼.넷[(i + 1) % 4]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2 / (잼.W * 잼.H);
      const 끝 = 잼.넷.some(([px, py]) => px < 2 || py < 2 || px > 잼.W - 3 || py > 잼.H - 3);
      if (끝) 말 = "조금만 멀리";
      else if (넓 < 0.12) 말 = "조금 더 가까이";
      else { 말 = "찍는 중…"; 좋음 = true; }
      const 움직임 = 이전 ? Math.max(...잼.넷.map((p, i) => Math.hypot(p[0] - 이전[i][0], p[1] - 이전[i][1]))) / 짧 : 1;
      이전 = 잼.넷;
      멎음 = 좋음 && 움직임 < 0.06 ? 멎음 + 1 : 0;
    } else { 이전 = null; 멎음 = 0; }
    겹그리기(잼);
    $("캠말").textContent = 말; $("캠말").className = 좋음 ? "잡힘" : "";
    if (멎음 >= 2) { 찍기(); return; }
  }
  setTimeout(살피기, 120);
}
async function 찍기() {
  if (!스트림) return;
  살핌 = false;
  $("캠").classList.remove("번쩍"); void $("캠").offsetWidth; $("캠").classList.add("번쩍");
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  let 그림 = null;
  try {                                                                 // 되면 사진 셔터(해상도가 더 높다) · 아니면 영상 한 장
    const tr = 스트림.getVideoTracks()[0];
    if (window.ImageCapture) 그림 = await 그림읽기(await new ImageCapture(tr).takePhoto());
  } catch (e) { 그림 = null; }
  if (!그림) 그림 = 줄이기($("영상"), 4096);
  카메라닫기();
  겹그리기(null);
  await 받은그림(그림);
}
$("캠닫기").onclick = () => 카메라닫기();
$("캠찍기").onclick = () => 찍기();
$("찍기").onclick = async () => {
  if (!파일로 && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    if (await 카메라열기()) return;
    파일로 = true;                                                      // 카메라를 못 열었다(권한 거절 · 카톡 안 브라우저 등) — 다음부터는 폰 기본 카메라
    알리기("주의", "카메라를 못 열었어요. 한 번 더 누르면 폰 카메라로 찍어요.");
    return;
  }
  $("카메라").value = ""; $("카메라").click();
};
$("카메라").onchange = e => 받음(e.target.files[0]);                 // ★ 11-13 사장님 「사진첩에서 고르기도 없애」 — 카메라로 찍기만
$("보내기").onclick = () => { if (대기) 올리기(대기); };
</script>
